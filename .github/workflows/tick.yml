name: hive-tick

# The Hive's heartbeat. Free on public repos. GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: "3-59/10 * * * *"  # every 10 minutes, off the busy top of the hour
  workflow_dispatch:

concurrency:
  group: hive-tick
  cancel-in-progress: false

defaults:
  run:
    working-directory: chog-hivemind

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chog-hivemind/package-lock.json
      - name: Check the database secrets
        # Without them the tick would "succeed" against a throwaway local database and the live world would not move.
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          case "$TURSO_DATABASE_URL" in libsql://*) ;; *) echo "::error::Secret TURSO_DATABASE_URL is missing or not a libsql:// URL"; exit 1;; esac
          [ -n "$TURSO_AUTH_TOKEN" ] || { echo "::error::Secret TURSO_AUTH_TOKEN is missing"; exit 1; }
      - run: npm ci
      - name: Run ticks
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICK_AGENTS: ${{ vars.TICK_AGENTS || '30' }}
          SEASON_HOURS: ${{ vars.SEASON_HOURS || '24' }}
          SIM_TICK_SECONDS: ${{ vars.SIM_TICK_SECONDS || '600' }}
        # One tick per run: the season simulation paces itself by real time, and a lock in the database
        # stops overlapping runs (e.g. with a backup cron calling /api/cron/tick).
        run: npm run tick -- 1
