		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #05080f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

font-style: italic; color: #a8d08d; transition: opacity 0.4s; } </style> <script> (function () { var TIPS = [ 'Every Chog has a job. Any job can become the Hero.', 'Four Demon Generals guard the seals. Break them all to reach the castle.', 'Holders draw 5 skills and 5 quests a day, and bestow 2 of each.', 'Skills that match a quest make it finish faster.', 'Click any Chog to read its Status Window and its Life.', 'The Chronicle writes itself as the season unfolds.', 'A new season every day: jobs re-roll, the Demon King wakes again.', 'Press H to hide the HUD and just watch the world.' ]; var HEART = `<svg viewBox='0 0 32 30'><path d='M16 28 C 6 20 1 15 1 9 A 7.5 7.5 0 0 1 16 6 A 7.5 7.5 0 0 1 31 9 C 31 15 26 20 16 28 Z'/></svg>`; function start() { var status = document.getElementById('status'); var bar = document.getElementById('status-progress'); if (!status || !bar) return; var box = document.createElement('div'); box.id = 'cs-loader'; var hearts = ''; for (var i = 0; i < 10; i++) hearts += HEART; box.innerHTML = '<h1>CHOGSEKAI</h1><div class=sub>The Monadia Cycle</div><div id=cs-hearts>' + hearts + '</div><div class=line id=cs-line>Summoning 1,969 Chogs to Monadia...</div><div class=tip id=cs-tip></div>'; status.appendChild(box); var svgs = box.querySelectorAll('#cs-hearts svg'); var line = document.getElementById('cs-line'); var tip = document.getElementById('cs-tip'); var t = Math.floor(Math.random() * TIPS.length); tip.textContent = TIPS[t]; setInterval(function () { tip.style.opacity = 0; setTimeout(function () { t = (t + 1) % TIPS.length; tip.textContent = TIPS[t]; tip.style.opacity = 1; }, 400); }, 3800); var spin = 0; var timer = setInterval(function () { if (!document.body.contains(box)) { clearInterval(timer); return; } var has = bar.hasAttribute('max') && bar.max > 0; var p = has ? Math.min(1, bar.value / bar.max) : -1; var lit = p >= 0 ? Math.round(p * 10) : (++spin % 11); for (var k = 0; k < svgs.length; k++) svgs[k].setAttribute('class', k < lit ? 'on' : ''); line.textContent = p >= 0 ? 'Summoning 1,969 Chogs to Monadia... ' + Math.round(p * 100) + '%' : 'Opening the gate to Monadia...'; }, 120); } if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start(); })(); </script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10640840,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
