<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>web</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: radial-gradient(ellipse at 50% 30%, #12301f 0%, #08160e 60%, #040b07 100%); }
  canvas { position:absolute; inset:0; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(227,189,85,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(227,189,85,.05) 1px, transparent 1px); background-size:60px 60px; }
  #win { position:absolute; left:280px; top:60px; width:1360px; height:821px; border-radius:16px; overflow:hidden; background:#0b1410; border:2px solid rgba(255,255,255,.22);
    box-shadow:0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6), 0 0 80px rgba(227,189,85,.12); }
  #bar { position:absolute; left:0; top:0; width:100%; height:56px; background:linear-gradient(180deg,#26302b,#1a221e); display:flex; align-items:center; gap:14px; padding:0 18px; }
  .dot { width:14px; height:14px; border-radius:50%; } .r{background:#ff5f57} .y{background:#febc2e} .g{background:#28c840}
  #tab { margin-left:10px; padding:8px 20px; border-radius:10px 10px 0 0; background:#0b1410; font-size:18px; color:var(--cream); font-weight:600; white-space:nowrap; }
  #urlbox { margin-left:16px; flex:1; height:36px; border-radius:18px; background:#0b1410; display:flex; align-items:center; padding:0 18px; font-size:21px; color:var(--cream); letter-spacing:.02em; }
  #lock { color:#7fd36b; margin-right:10px; font-size:18px; }
  #content { position:absolute; left:0; top:56px; width:1360px; height:765px; overflow:hidden; background:#000; }
  #content img { position:absolute; left:0; top:0; width:1360px; height:765px; }
  #cursor { position:absolute; left:0; top:0; width:30px; height:36px; z-index:20; }
  #ripple { position:absolute; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%; border:4px solid var(--gold-soft); box-shadow:0 0 24px rgba(255,226,138,.9); opacity:0; z-index:19; }
  #chips { position:absolute; left:0; width:1920px; top:912px; display:flex; justify-content:center; gap:22px; }
</style></head>
<body><div class="stage">
  <div class="grid"></div><canvas id="stars" width="1920" height="1080"></canvas>
  <div id="win">
    <div id="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <div id="tab">ChogSekai</div>
      <div id="urlbox"><span id="lock">&#128274;</span><span id="u"></span></div></div>
    <div id="content">
      <img id="i1" src="assets/web_loader.jpg"><img id="i2" src="assets/web_title.jpg"><img id="i3" src="assets/web_world1.jpg"><img id="i4" src="assets/web_world2.jpg">
      <svg id="cursor" viewBox="0 0 30 36"><polygon points="0,0 0,28 7.5,21.5 12.5,33 17.5,30.8 12.6,19.6 22,19" fill="#fff" stroke="#000" stroke-width="2"/></svg>
      <div id="ripple"></div>
    </div>
  </div>
  <div id="chips"><span class="chip">No install</span><span class="chip sky">Nothing to connect just to watch</span><span class="chip violet">Wallet only for Star Pulls</span></div>
</div>
<script src="gsap.min.js"></script><script src="common.js"></script>
<script>
  window.drawers.push(window.makeStars(document.getElementById("stars"), { count: 180, seed: 31 }));
  const url = "chogsekai.vercel.app", u = document.getElementById("u"), o = { n: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.set(["#i2", "#i3", "#i4", "#cursor", "#ripple", "#chips .chip"], { opacity: 0 });
  tl.fromTo("#win", { y: 80, scale: 0.9, opacity: 0, rotateX: 8 }, { y: 0, scale: 1, opacity: 1, rotateX: 0, duration: 0.8, ease: "power3.out" }, 0.0);
  tl.to(o, { n: url.length, duration: 1.1, ease: "none", onUpdate: () => (u.textContent = url.slice(0, Math.floor(o.n))) }, 0.7);
  // slow push-in on whatever is showing
  tl.fromTo("#content img", { scale: 1.0 }, { scale: 1.06, duration: 9.8, ease: "none", transformOrigin: "50% 50%" }, 0);
  // loader -> title -> world (real captures of the live site)
  tl.to("#i2", { opacity: 1, duration: 0.6 }, 3.0);
  tl.fromTo("#cursor", { x: 1100, y: 600, opacity: 0 }, { x: 680, y: 786, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 3.9);
  tl.fromTo("#ripple", { x: 680, y: 786, opacity: 1, scale: 0.4 }, { x: 680, y: 786, opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out" }, 4.95);
  tl.to("#i3", { opacity: 1, duration: 0.7 }, 5.2);
  tl.to("#cursor", { x: 900, y: 500, duration: 1.2, ease: "power2.inOut" }, 5.4);
  tl.to("#i4", { opacity: 1, duration: 1.2 }, 6.8);
  tl.to("#cursor", { opacity: 0, duration: 0.4 }, 6.7);
  tl.fromTo("#chips .chip", { y: 30, opacity: 0, scale: 0.7 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.35 }, 3.6);
  tl.to("#win", { opacity: 0, y: -20, duration: 0.6, ease: "power2.in" }, 9.2);
  tl.to("#chips", { opacity: 0, duration: 0.4 }, 9.2);
  tl.to({}, { duration: 0.01 }, 9.8);
  window.tl = tl;
</script></body></html>
