<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>outro</title>
<link rel="stylesheet" href="common.css">
<style>
  .bg { position:absolute; inset:-80px; background:url(assets/title.jpg) center/cover; filter:blur(10px) brightness(.4) saturate(1.2); }
  canvas { position:absolute; inset:0; }
  #logo { top:150px; left:0; width:1920px; text-align:center; font-size:190px; font-weight:900; color:var(--gold-soft); line-height:1; }
  #line { top:395px; left:0; width:1920px; text-align:center; font-size:86px; font-weight:700; letter-spacing:.03em; color:var(--cream); }
  #line span { display:inline-block; margin:0 .2em; }
  #line .star { color:var(--gold-soft); text-shadow:0 0 24px rgba(255,226,138,.9), 0 0 70px rgba(227,189,85,.5); }
  #url { top:565px; left:50%; transform:translateX(-50%); padding:22px 56px; border:4px solid var(--gold); border-radius:18px; background:rgba(8,22,14,.9); font-size:72px; font-weight:700; letter-spacing:.03em; color:var(--cream); white-space:nowrap; }
  #how { top:735px; left:0; width:1920px; text-align:center; font-size:34px; color:var(--cream); line-height:1.6; }
</style></head>
<body><div class="stage">
  <div class="bg"></div>
  <canvas id="stars" width="1920" height="1080"></canvas>
  <div class="abs serif glow" id="logo">ChogSekai</div>
  <div class="abs serif" id="line"></div>
  <div class="abs" id="url"><span id="u"></span></div>
  <div class="abs" id="how">Holders: connect your wallet and use your Star Pulls<br>Judges: the sign-in code is in the submission form</div>
  <div class="vignette"></div>
  <div class="abs" id="fade" style="inset:0;background:#000"></div>
</div>
<script src="gsap.min.js"></script><script src="common.js"></script>
<script>
  window.drawers.push(window.makeStars(document.getElementById("stars"), { count: 220, seed: 21 }));
  const url = "chogsekai.vercel.app", u = document.getElementById("u"), o = { n: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.set(["#logo", "#url", "#how"], { opacity: 0 });
  tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.9 }, 0);
  tl.fromTo("#logo", { scale: 0.8, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 1.2, ease: "power3.out" }, 0.2);
  const line = document.getElementById("line");
  const words = [["Be", 2.48], ["the", 2.69], ["god", 2.79], ["in", 3.05], ["their", 3.15], ["story.", 3.29]];
  const spans = words.map(([w]) => { const e = document.createElement("span"); e.textContent = w; if (w === "god") e.className = "star"; line.appendChild(e); return e; });
  tl.set(spans, { opacity: 0 });
  spans.forEach((e, i) => tl.fromTo(e, { y: 40, opacity: 0, scale: 0.8, filter: "blur(10px)" }, { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.8)" }, words[i][1] - 0.05));
  tl.fromTo(spans[2], { scale: 1 }, { scale: 1.18, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.7);
  tl.fromTo("#url", { y: 40, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 4.3);
  tl.to(o, { n: url.length, duration: 1.3, ease: "none", onUpdate: () => (u.textContent = url.slice(0, Math.floor(o.n))) }, 4.5);
  tl.fromTo("#how", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9 }, 5.7);
  tl.to("#fade", { opacity: 1, duration: 1.0 }, 8.6);
  tl.to({}, { duration: 0.01 }, 9.6);
  window.tl = tl;
</script></body></html>
