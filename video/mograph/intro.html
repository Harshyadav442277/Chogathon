<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>intro</title>
<link rel="stylesheet" href="common.css">
<style>
  .bg { position:absolute; inset:-60px; background:url(assets/title.jpg) center/cover; filter:brightness(.55) saturate(1.1); transform-origin:50% 60%; }
  .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(3,8,6,.88) 0%, rgba(3,8,6,.35) 45%, rgba(3,8,6,.78) 100%); }
  canvas { position:absolute; inset:0; }
  #counter { top:380px; left:760px; width:1100px; text-align:center; font-size:230px; font-weight:900; letter-spacing:.02em; color:var(--gold-soft); }
  #cap { top:660px; left:780px; width:1060px; text-align:center; font-size:38px; font-weight:500; color:var(--cream); letter-spacing:.04em; }
  #title { top:330px; left:720px; width:1180px; text-align:center; font-size:200px; font-weight:900; line-height:1; white-space:nowrap; color:var(--gold-soft); }
  #title span { display:inline-block; }
  #sub1 { top:610px; left:760px; width:1100px; text-align:center; font-size:52px; letter-spacing:.14em; font-weight:700; color:var(--cream); }
  #sub2 { top:700px; left:760px; width:1100px; text-align:center; font-size:32px; font-weight:500; color:var(--dim); letter-spacing:.06em; }
  #lantern { left:1480px; top:790px; width:90px; height:270px; }
  #flare { position:absolute; left:1330px; top:620px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(255,214,120,.85) 0%, rgba(255,170,60,.35) 35%, rgba(255,150,40,0) 70%); mix-blend-mode:screen; }
  #sweep { top:330px; left:720px; width:1180px; height:230px; background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%); mix-blend-mode:overlay; opacity:0; }
  .rule { height:3px; background:linear-gradient(90deg, transparent, var(--gold), transparent); left:900px; width:800px; top:572px; }
</style></head>
<body><div class="stage">
  <div class="bg" id="bg"></div><div class="shade"></div><div class="abs" style="left:700px;top:0;width:1220px;height:1080px;background:linear-gradient(90deg,rgba(2,6,4,0),rgba(2,6,4,.55) 25%,rgba(2,6,4,.55) 100%)"></div>
  <canvas id="snow" width="1920" height="1080"></canvas>
  <div id="flare"></div>
  <svg id="lantern" class="abs" viewBox="0 0 100 300">
    <rect x="46" y="110" width="8" height="190" fill="#222a26"/>
    <rect x="30" y="96" width="40" height="12" rx="3" fill="#2d3631"/>
    <path d="M34 96 L66 96 L62 40 L38 40 Z" fill="rgba(255,225,150,.18)" stroke="#3b4640" stroke-width="4"/>
    <path d="M38 40 L50 22 L62 40 Z" fill="#2d3631"/>
    <ellipse id="flame" cx="50" cy="72" rx="9" ry="16" fill="#ffd886"/>
    <ellipse cx="50" cy="76" rx="4" ry="9" fill="#fff6d6"/>
  </svg>
  <div id="counter" class="abs serif glow">0</div>
  <div id="cap" class="abs">Chogs woke at a crossroads, beneath a lantern nobody lit</div>
  <div id="title" class="abs serif glow"></div>
  <div id="sweep" class="abs"></div>
  <div class="abs rule" id="rule" style="opacity:0"></div>
  <div id="sub1" class="abs serif">AN ISEKAI GOD-SIM</div>
  <div id="sub2" class="abs">Every Chog Genesis NFT is a living character in Monadia</div>
  <div class="vignette"></div>
  <div id="fade" class="abs" style="inset:0;background:#000"></div>
</div>
<script src="gsap.min.js"></script><script src="common.js"></script>
<script>
  const title = document.getElementById("title");
  "ChogSekai".split("").forEach((ch) => { const s = document.createElement("span"); s.textContent = ch; title.appendChild(s); });
  const letters = title.querySelectorAll("span");
  const counter = document.getElementById("counter");
  const snow = window.makeSnow(document.getElementById("snow"), { count: 260, speed: 55, drift: 40 });
  const flame = document.getElementById("flame"), flare = document.getElementById("flare");
  window.drawers.push(snow, (t) => {
    const f = 0.9 + 0.1 * Math.sin(t * 9) + 0.05 * Math.sin(t * 23.7);
    flame.setAttribute("ry", 16 * f); flare.style.opacity = Math.min(1, Math.max(0, (t - 0.6) / 1.4)) * (0.8 + 0.2 * f) * (t > 14 ? 1 : 1);
  });
  const c = { v: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.set([counter, "#cap", "#sub1", "#sub2", letters], { opacity: 0 });
  tl.fromTo("#bg", { scale: 1.16 }, { scale: 1.0, duration: 17, ease: "none" }, 0);
  tl.fromTo("#bg", { filter: "brightness(.25) saturate(1)" }, { filter: "brightness(.62) saturate(1.1)", duration: 5, ease: "power1.out" }, 0);
  tl.to("#fade", { opacity: 0, duration: 1.2, ease: "power1.out" }, 0);
  // 1: the count
  tl.to(counter, { opacity: 1, duration: 0.8 }, 0.9);
  tl.to(c, { v: 1969, duration: 4.4, ease: "power2.out", onUpdate: () => (counter.textContent = Math.round(c.v).toLocaleString("en-US")) }, 1.0);
  tl.fromTo("#cap", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, 3.2);
  tl.to([counter, "#cap"], { opacity: 0, y: -40, duration: 0.9, ease: "power2.in", stagger: 0.08 }, 7.2);
  // 2: the title
  tl.fromTo(letters, { opacity: 0, y: 120, rotateX: -80, filter: "blur(14px)" }, { opacity: 1, y: 0, rotateX: 0, filter: "blur(0px)", duration: 1.1, ease: "back.out(1.6)", stagger: 0.07 }, 8.2);
  tl.fromTo("#sweep", { x: -1400, opacity: 0.9 }, { x: 1400, opacity: 0.9, duration: 1.8, ease: "power2.inOut" }, 9.4);
  tl.fromTo("#rule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power3.out" }, 9.6);
  tl.fromTo("#sub1", { opacity: 0, letterSpacing: "0.4em" }, { opacity: 1, letterSpacing: "0.14em", duration: 1.2, ease: "power2.out" }, 10.0);
  tl.fromTo("#sub2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 11.8);
  tl.to({}, { duration: 0.01 }, 17);
  window.tl = tl;
</script></body></html>
