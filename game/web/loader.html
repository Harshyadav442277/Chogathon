<meta name='description' content='ChogSekai: an isekai god-sim where all 1,969 Chog Genesis NFTs live, work, quest and fight the Demon King. Watch every Chog live; holders draw skills and quests every day.'>
<meta property='og:title' content='ChogSekai'>
<meta property='og:description' content='1,969 Chogs. One Demon King. Every season, a new Hero.'>
<meta property='og:image' content='https://chogsekai.vercel.app/og.jpg'>
<meta name='twitter:card' content='summary_large_image'>
<meta name='twitter:image' content='https://chogsekai.vercel.app/og.jpg'>
<style>
#status { background: #05060f url('/title.jpg') center/cover no-repeat !important; }
#status-splash, #status-progress { display: none !important; }
#status-notice { background: rgba(5, 14, 9, 0.92) !important; border: 2px solid #d8b24a; border-radius: 8px; color: #f3e9c6 !important; font-family: Georgia, serif; }
#cs-loader { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(560px, 90vw); padding: 18px 26px 16px;
  background: rgba(6, 16, 10, 0.88); border: 3px double #d8b24a; border-radius: 10px; box-shadow: 0 0 0 2px #3a2a0a, 0 10px 30px rgba(0, 0, 0, 0.6);
  text-align: center; font-family: Georgia, 'Times New Roman', serif; color: #f3e9c6; }
#cs-loader h1 { margin: 0; font-size: 34px; letter-spacing: 3px; color: #f2cf63; text-shadow: 0 2px 0 #3a2a0a, 0 0 12px rgba(242, 207, 99, 0.45); }
#cs-loader .sub { margin: 2px 0 12px; font-size: 13px; letter-spacing: 2px; color: #cbbf98; text-transform: uppercase; }
#cs-hearts { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
#cs-hearts svg { width: 26px; height: 24px; filter: drop-shadow(0 1px 0 #000); transition: transform 0.2s; }
#cs-hearts svg.on { transform: scale(1.12); }
#cs-hearts path { fill: #3a1010; stroke: #000; stroke-width: 1.4; transition: fill 0.25s; }
#cs-hearts svg.on path { fill: #e63946; }
#cs-loader .line { font-size: 15px; }
#cs-loader .tip { margin-top: 8px; min-height: 18px; font-size: 13px; font-style: italic; color: #a8d08d; transition: opacity 0.4s; }
</style>
<script>
(function () {
  var TIPS = [
    'Every Chog has a job. Any job can become the Hero.',
    'Four Demon Generals guard the seals. Break them all to reach the castle.',
    'Holders draw 5 skills and 5 quests a day, and bestow 2 of each.',
    'Skills that match a quest make it finish faster.',
    'Click any Chog to read its Status Window and its Life.',
    'The Chronicle writes itself as the season unfolds.',
    'A new season every day: jobs re-roll, the Demon King wakes again.',
    'Press H to hide the HUD and just watch the world.'
  ];
  var HEART = `<svg viewBox='0 0 32 30'><path d='M16 28 C 6 20 1 15 1 9 A 7.5 7.5 0 0 1 16 6 A 7.5 7.5 0 0 1 31 9 C 31 15 26 20 16 28 Z'/></svg>`;
  function start() {
    var status = document.getElementById('status');
    var bar = document.getElementById('status-progress');
    if (!status || !bar) return;
    var box = document.createElement('div');
    box.id = 'cs-loader';
    var hearts = '';
    for (var i = 0; i < 10; i++) hearts += HEART;
    box.innerHTML = '<h1>CHOGSEKAI</h1><div class=sub>The Monadia Cycle</div><div id=cs-hearts>' + hearts +
      '</div><div class=line id=cs-line>Summoning 1,969 Chogs to Monadia...</div><div class=tip id=cs-tip></div>';
    status.appendChild(box);
    var svgs = box.querySelectorAll('#cs-hearts svg');
    var line = document.getElementById('cs-line');
    var tip = document.getElementById('cs-tip');
    var t = Math.floor(Math.random() * TIPS.length);
    tip.textContent = TIPS[t];
    setInterval(function () {
      tip.style.opacity = 0;
      setTimeout(function () { t = (t + 1) % TIPS.length; tip.textContent = TIPS[t]; tip.style.opacity = 1; }, 400);
    }, 3800);
    var spin = 0;
    var timer = setInterval(function () {
      if (!document.body.contains(box)) { clearInterval(timer); return; }
      var has = bar.hasAttribute('max') && bar.max > 0;
      var p = has ? Math.min(1, bar.value / bar.max) : -1;
      var lit = p >= 0 ? Math.round(p * 10) : (++spin % 11);
      for (var k = 0; k < svgs.length; k++) svgs[k].setAttribute('class', k < lit ? 'on' : '');
      line.textContent = p >= 0 ? 'Summoning 1,969 Chogs to Monadia... ' + Math.round(p * 100) + '%' : 'Opening the gate to Monadia...';
    }, 120);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
